<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" role="img" aria-label="SQL query against a transactions database returning flagged customers">
<defs>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef4ff"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5aa9ff"/><stop offset="1" stop-color="#0066cc"/></linearGradient>
  <linearGradient id="indigo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b93ff"/><stop offset="1" stop-color="#4338ca"/></linearGradient>
  <radialGradient id="glowA" cx=".2" cy=".15" r=".6"><stop offset="0" stop-color="#5aa9ff" stop-opacity=".45"/><stop offset="1" stop-color="#5aa9ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowB" cx=".9" cy=".9" r=".6"><stop offset="0" stop-color="#8b93ff" stop-opacity=".4"/><stop offset="1" stop-color="#8b93ff" stop-opacity="0"/></radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1e3a8a" flood-opacity=".10"/></filter>
</defs>
<style>
  .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .flow { stroke-dasharray: 6 10; animation: flow 1.6s linear infinite; }
  @keyframes pulse { 50% { transform: scale(1.18); opacity: .75; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes grow { from { transform: scaleY(0); } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes flow { to { stroke-dashoffset: -32; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; stroke-dashoffset: 0 !important; } }
</style>
<rect width="560" height="440" rx="28" fill="url(#panel)"/>
<rect width="560" height="440" rx="28" fill="url(#glowA)"/>
<rect width="560" height="440" rx="28" fill="url(#glowB)"/>
<rect x=".5" y=".5" width="559" height="439" rx="27.5" fill="none" stroke="#ffffff" stroke-opacity=".9"/>
<path d="M60,120 v48 a80,20 0 0 0 160,0 v-48" fill="url(#blue)" fill-opacity="0.90" class="fade" style="animation-delay:0ms"/><ellipse cx="140" cy="120" rx="80" ry="20" fill="#5aa9ff" stroke="#fff" stroke-width="2"/><path d="M60,184 v48 a80,20 0 0 0 160,0 v-48" fill="url(#blue)" fill-opacity="0.72" class="fade" style="animation-delay:150ms"/><ellipse cx="140" cy="184" rx="80" ry="20" fill="#5aa9ff" stroke="#fff" stroke-width="2"/><path d="M60,248 v48 a80,20 0 0 0 160,0 v-48" fill="url(#blue)" fill-opacity="0.54" class="fade" style="animation-delay:300ms"/><ellipse cx="140" cy="248" rx="80" ry="20" fill="#5aa9ff" stroke="#fff" stroke-width="2"/><text x="140" y="370" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0066cc" text-anchor="middle">lab.sqlite</text><rect x="262" y="40" width="270" height="172" rx="16" fill="#fff" fill-opacity=".86" stroke="#1d1d1f" stroke-opacity=".06" filter="url(#soft)" /><text x="282" y="76" font-family="SF Mono, Menlo, monospace" font-size="12.5" fill="#4338ca" class="fade" style="animation-delay:300ms">SELECT</text><text x="282" y="96" font-family="SF Mono, Menlo, monospace" font-size="12.5" fill="#1d1d1f" class="fade" style="animation-delay:420ms"> customer_id,</text><text x="282" y="116" font-family="SF Mono, Menlo, monospace" font-size="12.5" fill="#1d1d1f" class="fade" style="animation-delay:540ms"> COUNT(*) AS hits</text><text x="282" y="136" font-family="SF Mono, Menlo, monospace" font-size="12.5" fill="#4338ca" class="fade" style="animation-delay:660ms">FROM</text><text x="282" y="156" font-family="SF Mono, Menlo, monospace" font-size="12.5" fill="#1d1d1f" class="fade" style="animation-delay:780ms"> transfers</text><text x="282" y="176" font-family="SF Mono, Menlo, monospace" font-size="12.5" fill="#4338ca" class="fade" style="animation-delay:900ms">WHERE</text><text x="282" y="196" font-family="SF Mono, Menlo, monospace" font-size="12.5" fill="#0066cc" class="fade" style="animation-delay:1100ms"> minutes_held &lt; 30</text><rect x="262" y="222" width="270" height="186" rx="16" fill="#fff" fill-opacity=".86" stroke="#1d1d1f" stroke-opacity=".06" filter="url(#soft)" /><text x="282" y="250" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1d1d1f" text-anchor="start">Results</text><g class="fade" style="animation-delay:1300ms"><line x1="282" y1="286" x2="512" y2="286" stroke="#1d1d1f" stroke-opacity=".06"/><text x="282" y="278" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#1d1d1f" text-anchor="start">Demo Rapid 01</text><circle cx="398" cy="274" r="4" fill="#c4302b"/><text x="408" y="278" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="500" fill="#55555d" text-anchor="start">rapid movement</text></g><g class="fade" style="animation-delay:1450ms"><line x1="282" y1="318" x2="512" y2="318" stroke="#1d1d1f" stroke-opacity=".06"/><text x="282" y="310" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#1d1d1f" text-anchor="start">Demo Crowd 02</text><circle cx="398" cy="306" r="4" fill="#b26a00"/><text x="408" y="310" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="500" fill="#55555d" text-anchor="start">many to one</text></g><g class="fade" style="animation-delay:1600ms"><line x1="282" y1="350" x2="512" y2="350" stroke="#1d1d1f" stroke-opacity=".06"/><text x="282" y="342" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#1d1d1f" text-anchor="start">Demo Profile 03</text><circle cx="398" cy="338" r="4" fill="#0066cc"/><text x="408" y="342" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="500" fill="#55555d" text-anchor="start">outside profile</text></g><g class="fade" style="animation-delay:1750ms"><line x1="282" y1="382" x2="512" y2="382" stroke="#1d1d1f" stroke-opacity=".06"/><text x="282" y="374" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#1d1d1f" text-anchor="start">Demo Rapid 05</text><circle cx="398" cy="370" r="4" fill="#c4302b"/><text x="408" y="374" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="500" fill="#55555d" text-anchor="start">rapid movement</text></g>
</svg>